<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8F2"/>
      <stop offset="1" stop-color="#F4EADD"/>
    </linearGradient>
  </defs>
  <rect width="360" height="260" fill="url(#bg4)"/>
  <!-- wall -->
  <rect x="0" y="0" width="360" height="200" fill="#FDF8F2"/>
  <rect x="0" y="200" width="360" height="60" fill="#E4EBDF"/>
  <!-- baseboard -->
  <rect x="0" y="196" width="360" height="6" fill="#C9A17C"/>
  <!-- sign board -->
  <rect x="60" y="60" width="240" height="110" rx="14" fill="#F3DCE0" stroke="#D98E9B" stroke-width="2"/>
  <rect x="70" y="70" width="220" height="90" rx="10" fill="#FFFFFF" opacity="0.6"/>
  <!-- name -->
  <text x="180" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#B56775">Alice</text>
  <text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#7C6B63">BEM-VINDA</text>
  <!-- stars around -->
  <g fill="#F2D9A6">
    <path d="M40 80l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M320 90l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M50 170l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M310 175l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
  <!-- hanging string -->
  <line x1="100" y1="40" x2="100" y2="60" stroke="#C9A17C" stroke-width="2"/>
  <line x1="260" y1="40" x2="260" y2="60" stroke="#C9A17C" stroke-width="2"/>
  <circle cx="100" cy="36" r="4" fill="#C9A17C"/>
  <circle cx="260" cy="36" r="4" fill="#C9A17C"/>
  <!-- flowers on wall -->
  <g transform="translate(30,150)">
    <circle cx="10" cy="10" r="8" fill="#D98E9B"/>
    <circle cx="22" cy="10" r="8" fill="#F2D9A6"/>
    <circle cx="16" cy="0" r="8" fill="#93A98C"/>
  </g>
  <g transform="translate(300,150)">
    <circle cx="10" cy="10" r="8" fill="#D98E9B"/>
    <circle cx="22" cy="10" r="8" fill="#F2D9A6"/>
    <circle cx="16" cy="0" r="8" fill="#93A98C"/>
  </g>
</svg>
