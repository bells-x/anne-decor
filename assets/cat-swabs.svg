<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8F2"/>
      <stop offset="1" stop-color="#F4EADD"/>
    </linearGradient>
  </defs>
  <rect width="360" height="260" fill="url(#bg7)"/>
  <!-- bunny holder -->
  <g transform="translate(110,40)">
    <!-- ears -->
    <ellipse cx="30" cy="10" rx="9" ry="30" fill="#F3DCE0"/>
    <ellipse cx="30" cy="10" rx="5" ry="22" fill="#D98E9B"/>
    <ellipse cx="110" cy="10" rx="9" ry="30" fill="#F3DCE0"/>
    <ellipse cx="110" cy="10" rx="5" ry="22" fill="#D98E9B"/>
    <!-- head/body -->
    <circle cx="70" cy="60" r="46" fill="#F3DCE0"/>
    <circle cx="70" cy="60" r="46" fill="none" stroke="#D98E9B" stroke-width="2"/>
    <!-- eyes -->
    <circle cx="52" cy="52" r="4" fill="#3F322D"/>
    <circle cx="88" cy="52" r="4" fill="#3F322D"/>
    <!-- nose -->
    <path d="M66 62 L70 68 L74 62 Z" fill="#B56775"/>
    <!-- mouth -->
    <path d="M62 72 Q 70 78 78 72" stroke="#B56775" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="44" cy="66" r="6" fill="#F2D9A6" opacity="0.6"/>
    <circle cx="96" cy="66" r="6" fill="#F2D9A6" opacity="0.6"/>
    <!-- body/cup -->
    <path d="M24 95 Q 70 80 116 95 L 110 170 Q 70 185 30 170 Z" fill="#FFFFFF"/>
    <path d="M24 95 Q 70 80 116 95" stroke="#D98E9B" stroke-width="2" fill="none"/>
    <!-- swabs inside -->
    <g stroke="#C9A17C" stroke-width="2">
      <line x1="45" y1="105" x2="55" y2="160"/>
      <line x1="60" y1="100" x2="68" y2="165"/>
      <line x1="75" y1="98" x2="78" y2="168"/>
      <line x1="90" y1="100" x2="88" y2="165"/>
      <line x1="100" y1="105" x2="98" y2="160"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="55" cy="160" r="4"/>
      <circle cx="68" cy="165" r="4"/>
      <circle cx="78" cy="168" r="4"/>
      <circle cx="88" cy="165" r="4"/>
      <circle cx="98" cy="160" r="4"/>
    </g>
  </g>
  <!-- hearts -->
  <g fill="#D98E9B" opacity="0.6">
    <path d="M40 60 C40 56 36 54 34 57 C32 54 28 56 28 60 C28 66 34 69 34 69 C34 69 40 66 40 60 Z"/>
    <path d="M320 80 C320 76 316 74 314 77 C312 74 308 76 308 80 C308 86 314 89 314 89 C314 89 320 86 320 80 Z"/>
  </g>
  <rect x="0" y="230" width="360" height="30" fill="#E4EBDF"/>
</svg>
