<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8F2"/>
      <stop offset="1" stop-color="#F4EADD"/>
    </linearGradient>
  </defs>
  <rect width="360" height="260" fill="url(#bg)"/>
  <!-- door -->
  <rect x="120" y="40" width="120" height="190" rx="8" fill="#C9A17C"/>
  <rect x="126" y="46" width="108" height="178" rx="6" fill="#FDF8F2"/>
  <circle cx="226" cy="135" r="5" fill="#B56775"/>
  <!-- hanger -->
  <path d="M180 40 Q 180 20 160 16" stroke="#B56775" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="158" cy="14" r="4" fill="#B56775"/>
  <!-- plaque -->
  <rect x="136" y="58" width="88" height="62" rx="12" fill="#F3DCE0" stroke="#D98E9B" stroke-width="2"/>
  <text x="180" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#B56775">Bem-vinda</text>
  <text x="180" y="106" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#3F322D">Alice</text>
  <!-- bow -->
  <g transform="translate(180,46)">
    <path d="M0 0 C -18 -14 -26 6 -10 8 C -26 10 -18 30 0 16 C 18 30 26 10 10 8 C 26 6 18 -14 0 0 Z" fill="#D98E9B"/>
    <circle cx="0" cy="8" r="4" fill="#B56775"/>
  </g>
  <!-- stars -->
  <g fill="#F2D9A6">
    <path d="M60 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M300 90l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M50 200l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
  <!-- floor line -->
  <rect x="0" y="230" width="360" height="30" fill="#E4EBDF"/>
</svg>
