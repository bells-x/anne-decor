<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8F2"/>
      <stop offset="1" stop-color="#F4EADD"/>
    </linearGradient>
    <linearGradient id="crib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A17C"/>
      <stop offset="1" stop-color="#A87A55"/>
    </linearGradient>
  </defs>
  <rect width="520" height="620" fill="url(#wall)"/>
  <!-- moon and stars -->
  <circle cx="420" cy="90" r="46" fill="#F2D9A6"/>
  <circle cx="400" cy="76" r="40" fill="#FDF8F2"/>
  <g fill="#D98E9B">
    <path d="M90 80l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M470 170l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M60 200l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="120" cy="130" rx="46" ry="22"/>
    <ellipse cx="150" cy="120" rx="34" ry="18"/>
    <ellipse cx="95" cy="125" rx="28" ry="16"/>
    <ellipse cx="390" cy="200" rx="50" ry="24"/>
    <ellipse cx="420" cy="190" rx="36" ry="18"/>
  </g>
  <!-- crib -->
  <g>
    <rect x="90" y="360" width="340" height="170" rx="18" fill="url(#crib)"/>
    <rect x="90" y="340" width="340" height="30" rx="10" fill="#B56775"/>
    <!-- bars -->
    <g fill="#8A5E3E">
      <rect x="110" y="370" width="6" height="150" rx="3"/>
      <rect x="140" y="370" width="6" height="150" rx="3"/>
      <rect x="170" y="370" width="6" height="150" rx="3"/>
      <rect x="200" y="370" width="6" height="150" rx="3"/>
      <rect x="230" y="370" width="6" height="150" rx="3"/>
      <rect x="260" y="370" width="6" height="150" rx="3"/>
      <rect x="290" y="370" width="6" height="150" rx="3"/>
      <rect x="320" y="370" width="6" height="150" rx="3"/>
      <rect x="350" y="370" width="6" height="150" rx="3"/>
      <rect x="380" y="370" width="6" height="150" rx="3"/>
      <rect x="410" y="370" width="6" height="150" rx="3"/>
    </g>
    <!-- mattress -->
    <rect x="100" y="348" width="320" height="12" rx="6" fill="#F3DCE0"/>
    <!-- blanket -->
    <path d="M100 360 Q 260 400 420 360 L 420 430 Q 260 470 100 430 Z" fill="#93A98C" opacity="0.85"/>
    <!-- bunny -->
    <g transform="translate(230,300)">
      <ellipse cx="30" cy="40" rx="26" ry="22" fill="#FFFFFF"/>
      <circle cx="30" cy="22" r="16" fill="#FFFFFF"/>
      <ellipse cx="20" cy="6" rx="5" ry="14" fill="#FFFFFF"/>
      <ellipse cx="40" cy="6" rx="5" ry="14" fill="#FFFFFF"/>
      <circle cx="24" cy="20" r="2.5" fill="#3F322D"/>
      <circle cx="36" cy="20" r="2.5" fill="#3F322D"/>
      <path d="M26 28 Q30 32 34 28" stroke="#B56775" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- rug -->
  <ellipse cx="260" cy="560" rx="180" ry="30" fill="#F3DCE0" opacity="0.7"/>
  <!-- hanging lamp -->
  <line x1="260" y1="0" x2="260" y2="60" stroke="#C9A17C" stroke-width="2"/>
  <circle cx="260" cy="74" r="22" fill="#F2D9A6"/>
  <circle cx="260" cy="74" r="10" fill="#FFF8F3"/>
</svg>
